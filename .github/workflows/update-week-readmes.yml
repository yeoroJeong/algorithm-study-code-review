name: Update Week READMEs

on:
  push:
    branches:
      - main
    paths:
      - "problems/**"
      - "solutions/**"
      - "scripts/generate_week_readmes.py"
      - "scripts/sync_week_folders.py"
      - ".github/workflows/update-week-readmes.yml"

  workflow_dispatch:
    inputs:
      week:
        description: "갱신할 주차 폴더 (비워두면 전체, 예: week02)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-week-readmes
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install PyYAML

      - name: Sync problem folders and generate READMEs
        env:
          SELECTED_WEEK: ${{ github.event.inputs.week }}
        run: |
          if [ -n "$SELECTED_WEEK" ]; then
            python scripts/sync_week_folders.py --week "$SELECTED_WEEK"
            python scripts/generate_week_readmes.py --week "$SELECTED_WEEK"
          else
            python scripts/sync_week_folders.py
            python scripts/generate_week_readmes.py
          fi

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add problems solutions
          if git diff --cached --quiet; then
            echo "자동 생성 변경사항이 없습니다."
            exit 0
          fi
          git commit -m "[CHORE] 주차 폴더 및 README 자동 갱신"
          git push
