name: Update Week READMEs

on:
  push:
    branches:
      - main
    paths:
      - "problems/**"
      - "solutions/**"
      - "scripts/generate_week_readmes.py"
      - ".github/workflows/update-week-readmes.yml"

  workflow_dispatch:
    inputs:
      week:
        description: "갱신할 주차 폴더 (비워두면 전체, 예: week01)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-week-readmes
  cancel-in-progress: false

jobs:
  generate:
    name: Generate weekly README files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install PyYAML

      - name: Generate README files
        env:
          SELECTED_WEEK: ${{ github.event.inputs.week }}
        run: |
          if [ -n "$SELECTED_WEEK" ]; then
            python scripts/generate_week_readmes.py --week "$SELECTED_WEEK"
          else
            python scripts/generate_week_readmes.py
          fi

      - name: Commit generated README files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add problems/week*/README.md

          if git diff --cached --quiet; then
            echo "README 변경사항이 없습니다."
            exit 0
          fi

          git commit -m "docs: 주차 README 자동 갱신"
          git push
